name: CI

# Se déclenche à chaque push et à chaque pull request, sur n'importe quelle branche.
on:
  push:
  pull_request:

jobs:
  backend-tests:
    name: Tests unitaires backend (Jest)
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Installer les dépendances du backend
        working-directory: backend
        run: npm ci

      - name: Lancer les tests unitaires
        working-directory: backend
        run: npm test

  frontend-build:
    name: Vérifier que le frontend compile (Vite build)
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances du frontend
        working-directory: frontend
        run: npm ci

      - name: Construire le frontend (vérifie qu'il n'y a pas d'erreur de compilation)
        working-directory: frontend
        run: npm run build
