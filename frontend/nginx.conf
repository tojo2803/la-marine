server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Nécessaire car le front utilise createWebHistory() (Vue Router) :
    # toute route inconnue de nginx doit retourner index.html, pour que
    # Vue Router gère lui-même la navigation côté client (sinon /carte ou
    # /reservation renverrait un 404 nginx si on rafraîchit la page).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
