version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: la-marine-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-la_marine}
      POSTGRES_USER: ${DB_USER:-la_marine_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - la_marine_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-la_marine_app} -d ${DB_NAME:-la_marine}"]
      interval: 5s
      timeout: 5s
      retries: 5


  adminer:
    image: adminer:latest
    container_name: la-marine-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  la_marine_pgdata:
