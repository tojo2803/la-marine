version: "3.9"

# Lance uniquement la base de données PostgreSQL en conteneur.
# Le backend Node.js continue de tourner directement sur ta machine
# (plus simple pour le développement : rechargement à chaud, débogage...).
#
# Démarrer :   docker compose up -d
# Arrêter :    docker compose down
# Tout effacer (recommence de zéro) : docker compose down -v

services:
  postgres:
    image: postgres:16-alpine
    container_name: la-marine-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-la_marine}
      POSTGRES_USER: ${DB_USER:-la_marine_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - la_marine_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-la_marine_app} -d ${DB_NAME:-la_marine}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Interface web facultative pour consulter la base facilement dans un navigateur.
  # Accessible sur http://localhost:8080 une fois lancée.
  adminer:
    image: adminer:latest
    container_name: la-marine-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  la_marine_pgdata:
